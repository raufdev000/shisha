<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Moishi</title>

    <link rel="stylesheet" href="styles.css">
    <style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #050509;
}

.hero-title {
    display: flex;
    flex-direction: column;
    align-items: center;

    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: 100px;
    line-height: 0.9;
    letter-spacing: -3px;
    text-align: center;

    background: linear-gradient(
        to bottom,
        #ffffff 0%,
        #eaf8ff 30%,
        #8fcfff 65%,
        #ffffff 100%
    );

    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;

    filter:
        drop-shadow(0 0 4px #ffffff)
        drop-shadow(0 0 12px #4da6ff)
        drop-shadow(0 0 25px #7a4dff);
}

.hero-title span:first-child {
    margin-bottom: 8px;
}
</style>
</head>

<body>

    <div class="hero-title">
        <span>CAFE</span>
        <span>MOISHI</span>
    </div>

</body>
</html>
